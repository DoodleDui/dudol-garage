<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">

<title>Dudol Garage</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.app{
    max-width:430px;
    min-height:100vh;
    margin:auto;
    background:#101010;
    padding-bottom:90px;
}

header{
    padding:24px 20px 12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:27px;
    font-weight:900;
    font-style:italic;
}

.logo span{
    color:#e10600;
}

.notification{
    width:43px;
    height:43px;
    border-radius:50%;
    background:#181818;
    border:1px solid #303030;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:19px;
}

.hero{
    margin:10px 16px 18px;
    padding:25px 21px;
    border-radius:22px;
    border:1px solid #303030;
    background:
        radial-gradient(circle at 100% 0%,rgba(225,6,0,.22),transparent 45%),
        linear-gradient(145deg,#202020,#111);
}

.hero-label{
    color:#999;
    font-size:11px;
    font-weight:800;
    letter-spacing:1px;
}

.hero h1{
    margin:9px 0 8px;
    font-size:32px;
    line-height:1;
}

.hero p{
    margin:0;
    color:#aaa;
    line-height:1.5;
}

.btn{
    width:100%;
    border:0;
    border-radius:13px;
    padding:15px;
    margin-top:20px;
    background:#e10600;
    color:white;
    font-size:14px;
    font-weight:900;
}

.section{
    padding:0 17px 20px;
}

.section-title{
    font-size:19px;
    font-weight:800;
    margin-bottom:12px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.card{
    background:#191919;
    border:1px solid #2c2c2c;
    border-radius:16px;
    padding:16px;
}

.action{
    min-height:125px;
}

.icon{
    font-size:25px;
}

.card-title{
    margin-top:11px;
    font-weight:800;
}

.card-sub{
    margin-top:5px;
    color:#858585;
    font-size:12px;
    line-height:1.35;
}

.car{
    display:flex;
    align-items:center;
    gap:14px;
}

.car-image{
    width:70px;
    height:52px;
    border-radius:12px;
    background:#292929;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
}

.car-info{
    flex:1;
}

.car-name{
    font-weight:800;
}

.car-details{
    color:#888;
    font-size:12px;
    margin-top:5px;
}

.badge{
    background:#35100e;
    color:#ff625d;
    font-size:9px;
    font-weight:900;
    padding:6px 8px;
    border-radius:7px;
}

.progress{
    height:5px;
    background:#2b2b2b;
    border-radius:10px;
    margin-top:10px;
}

.progress span{
    display:block;
    width:68%;
    height:100%;
    background:#e10600;
    border-radius:10px;
}

.job{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.job small{
    display:block;
    color:#888;
    margin-top:7px;
}

.bottom{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(430px,100%);
    height:78px;
    background:#111;
    border-top:1px solid #292929;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:10;
}

.nav{
    color:#777;
    text-align:center;
    font-size:10px;
    cursor:pointer;
}

.nav-icon{
    font-size:21px;
    margin-bottom:4px;
}

.nav.active{
    color:white;
}

.page{
    padding:20px;
}

.back{
    color:#999;
    margin-bottom:18px;
    cursor:pointer;
}

.page h1{
    margin:0 0 7px;
    font-size:29px;
}

.page-sub{
    color:#888;
    margin-bottom:20px;
}

.option{
    background:#191919;
    border:1px solid #303030;
    border-radius:13px;
    padding:16px;
    margin:9px 0;
    cursor:pointer;
}

.option.selected{
    border-color:#e10600;
    background:#25100f;
}

.input{
    width:100%;
    margin-top:12px;
    padding:14px;
    border-radius:11px;
    border:1px solid #333;
    background:#181818;
    color:white;
    font-size:14px;
}

.toast{
    display:none;
    position:fixed;
    left:50%;
    bottom:95px;
    transform:translateX(-50%);
    background:#e10600;
    color:white;
    padding:12px 18px;
    border-radius:11px;
    font-weight:800;
    z-index:20;
}
</style>
</head>

<body>

<div id="app"></div>

<script>

let selectedService = "";

function layout(content,active="home"){

document.getElementById("app").innerHTML=`

<div class="app">

${content}

<nav class="bottom">

<div class="nav ${active==="home"?"active":""}" onclick="home()">
<div class="nav-icon">⌂</div>
Home
</div>

<div class="nav ${active==="garage"?"active":""}" onclick="garage()">
<div class="nav-icon">🚗</div>
Garage
</div>

<div class="nav ${active==="book"?"active":""}" onclick="booking()">
<div class="nav-icon">＋</div>
Prenota
</div>

<div class="nav ${active==="jobs"?"active":""}" onclick="jobs()">
<div class="nav-icon">📋</div>
Lavori
</div>

<div class="nav">
<div class="nav-icon">👤</div>
Profilo
</div>

</nav>

<div id="toast" class="toast">
Operazione completata ✓
</div>

</div>
`;
}


function home(){

layout(`

<header>

<div class="logo">
<span>Dudol</span> Garage
</div>

<div class="notification">
🔔
</div>

</header>


<section class="hero">

<div class="hero-label">
DUDOL GARAGE
</div>

<h1>
La tua auto.<br>
Il nostro lavoro.
</h1>

<p>
Prenota interventi, richiedi preventivi e tieni sotto controllo la tua auto.
</p>

<button class="btn" onclick="booking()">
PRENOTA UN INTERVENTO
</button>

</section>


<section class="section">

<div class="section-title">
Accesso rapido
</div>

<div class="grid">

<div class="card action" onclick="booking()">
<div class="icon">🔧</div>
<div class="card-title">Prenota</div>
<div class="card-sub">
Tagliandi, gomme, officina e altro
</div>
</div>

<div class="card action">
<div class="icon">💰</div>
<div class="card-title">Preventivo</div>
<div class="card-sub">
Invia foto e descrizione
</div>
</div>

<div class="card action" onclick="garage()">
<div class="icon">🚗</div>
<div class="card-title">Il mio Garage</div>
<div class="card-sub">
Gestisci le tue auto
</div>
</div>

<div class="card action" onclick="jobs()">
<div class="icon">📋</div>
<div class="card-title">I miei lavori</div>
<div class="card-sub">
Storico interventi
</div>
</div>

</div>
</section>


<section class="section">

<div class="section-title">
La tua auto
</div>

<div class="card car">

<div class="car-image">
🏎️
</div>

<div class="car-info">

<div class="car-name">
Toyota Supra A90
</div>

<div class="car-details">
72.000 km
</div>

<div class="progress">
<span></span>
</div>

</div>

<div class="badge">
ATTIVA
</div>

</div>

</section>


<section class="section">

<div class="section-title">
Ultimo intervento
</div>

<div class="card job">

<div>

<strong>
Controllo generale
</strong>

<small>
Toyota Supra A90
</small>

<small>
Dudol Garage
</small>

</div>

<div class="badge">
COMPLETATO
</div>

</div>

</section>

`);
}


function garage(){

layout(`

<div class="page">

<div class="back" onclick="home()">
‹ Home
</div>

<h1>
Il mio Garage
</h1>

<div class="page-sub">
I tuoi veicoli
</div>


<div class="card car">

<div class="car-image">
🏎️
</div>

<div class="car-info">

<div class="car-name">
Toyota Supra A90
</div>

<div class="car-details">
Targa ••••123
</div>

<div class="car-details">
72.000 km
</div>

</div>

</div>


<button class="btn" onclick="alert('Funzione in sviluppo')">
+ AGGIUNGI VEICOLO
</button>

</div>

`,"garage");

}


function booking(){

selectedService="";

layout(`

<div class="page">

<div class="back" onclick="home()">
‹ Home
</div>

<h1>
Prenota
</h1>

<div class="page-sub">
Scegli il tipo di intervento
</div>


<div class="option" onclick="selectService(this)">
🔧 &nbsp; Tagliando
</div>

<div class="option" onclick="selectService(this)">
🛞 &nbsp; Pneumatici
</div>

<div class="option" onclick="selectService(this)">
🎨 &nbsp; Wrap / PPF
</div>

<div class="option" onclick="selectService(this)">
⚡ &nbsp; Diagnosi / Elettronica
</div>

<div class="option" onclick="selectService(this)">
🚗 &nbsp; Carrozzeria
</div>

<div class="option" onclick="selectService(this)">
✨ &nbsp; Altro
</div>


<input
class="input"
placeholder="Note per Dudol Garage"
/>


<button class="btn" onclick="sendBooking()">
CONTINUA
</button>

</div>

`,"book");

}


function selectService(element){

document
.querySelectorAll(".option")
.forEach(x=>x.classList.remove("selected"));

element.classList.add("selected");

selectedService=element.innerText;

}


function sendBooking(){

if(!selectedService){

alert("Seleziona prima un servizio.");

return;

}

let toast=document.getElementById("toast");

toast.innerText="Richiesta inviata ✓";

toast.style.display="block";

setTimeout(()=>{

toast.style.display="none";

jobs();

},1000);

}


function jobs(){

layout(`

<div class="page">

<div class="back" onclick="home()">
‹ Home
</div>

<h1>
I miei lavori
</h1>

<div class="page-sub">
Storico e stato degli interventi
</div>


<div class="card job">

<div>

<strong>
Controllo generale
</strong>

<small>
Toyota Supra A90
</small>

<small>
27 agosto 2026
</small>

</div>

<div class="badge">
COMPLETATO
</div>

</div>


<br>


<div class="card job">

<div>

<strong>
Prossimo intervento
</strong>

<small>
Manutenzione consigliata
</small>

<small>
Tra circa 10.000 km
</small>

</div>

<div class="badge">
DA PRENOTARE
</div>

</div>

</div>

`,"jobs");

}


home();

</script>

</body>
</html>
